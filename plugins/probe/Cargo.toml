[package]
name = "mehari-plugin-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "WebAssembly plugin for mehari's tests: reports what the plugin interface returns"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Built for wasm32-wasip2, so not part of the mehari workspace.
[workspace]
