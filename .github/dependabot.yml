# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    # The workspace root: from there, dependabot updates the members' manifests and Cargo.lock. From
    # /mehari it does not find the root, because mehari/Cargo.toml inherits nothing from the workspace.
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "rocksdb"
      # Stay on the wasmtime LTS line (see mehari/Cargo.toml); the next LTS is a manual move.
      - dependency-name: "wasmtime*"
        update-types: ["version-update:semver-major"]
    groups:
      # Group together updates to noodles as there are peer dependencies.
      # 
      # Also add "reverse" transitive dependencies.
      noodles:
        patterns:
          - "annonars"
          - "hgvs"
          - "seqrepo"
          - "noodles"
          - "noodles-*"
      utoipa:
        patterns:
          - "utoipa*"
      # wasmtime and wasmtime-wasi must be the same version.
      wasmtime:
        patterns:
          - "wasmtime*"
      prost:
        patterns:
          - "annonars"
          - "pbjson"
          - "pbjson-types"
          - "pbjson-build"
          - "prost"
          - "prost-build"

  - package-ecosystem: "uv"
    directory: "/mehari-python"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "*.txt"
