name: GitHub Pages Test Build

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: locosopa
        uses: koesterlab/locosopa@30a810dd3fe417a2092418548db9014fb5c388ed # v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: page/config.yaml
          path: build
          deploy: "false"
